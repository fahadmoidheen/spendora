# Runs on every push and pull request: the API's tests, and the web app's
# lint and build. Render waits for these to pass before deploying
# (render.yaml, autoDeployTrigger). See README "Deploy".

name: Checks

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still going.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Same Postgres as docker-compose.yml, with the test database the suite
    # insists on (its name must end in _test).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: expense_tracker_test
          POSTGRES_USER: expense_user
          POSTGRES_PASSWORD: expense_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_user -d expense_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://expense_user:expense_pass@localhost:5432/expense_tracker_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    name: Web app lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
